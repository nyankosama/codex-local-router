name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic:
    runs-on: macos-14
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Validate immutable release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace it." >&2
            exit 1
          fi
      - name: Classify full release scope
        id: scope
        shell: bash
        run: |
          previous_tag="$(git tag --merged HEAD --sort=-version:refname | awk -v current="$GITHUB_REF_NAME" '$0 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $0 != current { print; exit }')"
          test -n "$previous_tag"
          node scripts/release-scope.mjs --base "$previous_tag" --head "$GITHUB_SHA"
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run audit:package
      - run: node scripts/audit-public.mjs

  live-e2e:
    needs: deterministic
    if: needs.deterministic.outputs.docs_only != 'true'
    runs-on: [self-hosted, macOS, codex-local-router-release]
    environment: release-live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Qualify current Codex and real search routes
        shell: bash
        run: |
          evidence_dir="$RUNNER_TEMP/release-qualification-$GITHUB_RUN_ID"
          ACCEPTANCE_COMMIT="$GITHUB_SHA" npm run e2e:release -- --run --out "$evidence_dir"
          shasum -a 256 "$evidence_dir/summary.json"
          jq '{verdict, implementation, driver, budget, assertions, stages}' "$evidence_dir/summary.json"

  release:
    needs: [deterministic, live-e2e]
    if: >-
      always() &&
      needs.deterministic.result == 'success' &&
      (
        needs.live-e2e.result == 'success' ||
        (needs.deterministic.outputs.docs_only == 'true' && needs.live-e2e.result == 'skipped')
      )
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Recheck immutable release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace it." >&2
            exit 1
          fi
      - run: npm ci
      - name: Build and verify release assets
        id: assets
        shell: bash
        run: |
          package_file="$(npm pack --json | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk).on("end", () => process.stdout.write(JSON.parse(value)[0].filename))')"
          checksum_file="$package_file.sha256"
          shasum -a 256 "$package_file" > "$checksum_file"
          mkdir -p "$RUNNER_TEMP/router-prefix"
          npm install --prefix "$RUNNER_TEMP/router-prefix" --no-save "./$package_file"
          expected="Codex Local Router $(node -p 'require("./package.json").version')"
          test "$("$RUNNER_TEMP/router-prefix/node_modules/.bin/codex-local-router" --version)" = "$expected"
          test "$("$RUNNER_TEMP/router-prefix/node_modules/.bin/llm-auto-gateway" --version)" = "$expected"
          echo "package=$package_file" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum_file" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "$GITHUB_REF_NAME"
            "${{ steps.assets.outputs.package }}"
            "${{ steps.assets.outputs.checksum }}"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "$GITHUB_REF_NAME"
          )
          if test "${{ needs.deterministic.outputs.docs_only }}" = "true"; then
            args+=(--notes "Documentation-only release: runtime behavior is unchanged from v0.5.6. Real-model, Codex App, and search-channel live E2E were not rerun. Deterministic tests, audits, public export, packaging, and clean installation passed; the latest runtime live evidence remains v0.5.6.")
          fi
          gh release create "${args[@]}"
