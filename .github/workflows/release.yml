name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Validate immutable release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace it." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run audit:package
      - run: node scripts/audit-public.mjs
      - name: Build and verify release assets
        id: assets
        shell: bash
        run: |
          package_file="$(npm pack --json | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk).on("end", () => process.stdout.write(JSON.parse(value)[0].filename))')"
          checksum_file="$package_file.sha256"
          shasum -a 256 "$package_file" > "$checksum_file"
          mkdir -p "$RUNNER_TEMP/router-prefix"
          npm install --prefix "$RUNNER_TEMP/router-prefix" --no-save "./$package_file"
          expected="Codex Local Router $(node -p 'require("./package.json").version')"
          test "$("$RUNNER_TEMP/router-prefix/node_modules/.bin/codex-local-router" --version)" = "$expected"
          test "$("$RUNNER_TEMP/router-prefix/node_modules/.bin/llm-auto-gateway" --version)" = "$expected"
          echo "package=$package_file" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum_file" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.assets.outputs.package }}" \
            "${{ steps.assets.outputs.checksum }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
